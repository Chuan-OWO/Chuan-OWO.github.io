<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

    <script src="https://raw.githack.com/donmccurdy/aframe-extras/master/dist/aframe-extras.loaders.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/MindAR-js/gesture-handler@1.0.0/dist/gesture-handler.min.js"></script>
  </head>
  <body>
    <a-scene mindar-image="imageTargetSrc: ./assets/targets.mind;" vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false">
        <a-assets>
            <a-asset-item
                id="animated-asset"
                src="assets/asset2.glb"
            ></a-asset-item>
        </a-assets>

        <!-- 建議加入光源 -->
        <a-entity light="type: directional; intensity: 1" position="1 1 1"></a-entity>

        <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

        <a-entity mindar-image-target="targetIndex: 0">
          <a-gltf-model
            rotation="0 0 0"
            position="0 0 0.1"
            scale="0.005 0.005 0.005"
            src="#animated-asset"
            animation-mixer="loop: repeat"
            gesture-handler
          ></a-gltf-model>
        </a-entity>
    </a-scene>
  </body>
</html>
