    <script>
        import * as THREE from 'https://unpkg.com/three@0.160.0/build/three.module.js';
        import * as LocAR from 'https://unpkg.com/locar@latest/dist/locar.module.js';

        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(60, window.innerWidth/window.innerHeight, 0.001, 100);
        const renderer = new THREE.WebGLRenderer();
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        window.addEventListener("resize", e => {
            renderer.setSize(window.innerWidth, window.innerHeight);
            camera.aspect = window.innerWidth / window.innerHeight;    
            camera.updateProjectionMatrix();
        });
        const box = new THREE.BoxGeometry(2,2,2);
        const cube = new THREE.Mesh(box, new THREE.MeshBasicMaterial({ color: 0xff0000 }));

        const locar = new LocAR.LocationBased(scene, camera);
        const cam = new LocAR.WebcamRenderer(renderer);

        locar.fakeGps(22.654386, 120.343083);
        locar.add(cube, 22.654386, 120.343083);

        renderer.setAnimationLoop(animate);


        function animate() {
            cam.update();
            renderer.render(scene, camera);
        }

    </script>



</head>
<body>
</body>
</html>
